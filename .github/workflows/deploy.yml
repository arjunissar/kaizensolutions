name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8

      - run: flutter pub get

      # NOTE base-href:
      #  - Serving from https://arjunissar.github.io/kaizensolutions/ (no custom
      #    domain yet): keep --base-href /kaizensolutions/
      #  - Once the custom domain is live (site served from the domain root),
      #    change this to --base-href / and add a web/CNAME file with the domain.
      - run: flutter build web --release --base-href /kaizensolutions/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
